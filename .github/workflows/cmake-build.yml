name: Codemon CI - Multi-OS Build & Test

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install SFML (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install sfml

    - name: Install SFML (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install sfml:x64-windows
        echo "CMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV

    - name: Configure CMake
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        else
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        fi
    
    - name: Build Project
      run: cmake --build build --config Release

    - name: Run Tests
      working-directory: ./build
      run: ctest -C Release --output-on-failure