name: CMake Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Install SFML (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install sfml

    - name: Install SFML (Windows)
      if: matrix.os == 'windows-latest'
      run: vcpkg install sfml:x64-windows

    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        else
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build Project
      # We add --target codemon and --target run_tests to be explicit
      run: cmake --build build --config Release

    - name: Run Tests
      shell: bash
      working-directory: ./build
      run: |
        # This command is the 'magic' for cross-platform
        # -C Release tells Windows where to look, but Mac ignores it safely
        ctest -C Release --output-on-failure